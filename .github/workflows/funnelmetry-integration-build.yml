name: Funnelmetry integration build

on:
  push:
    branches:
      - "funnelmetry/integration/**"
    paths:
      - pnpm-lock.yaml
      - apps/backend/package.json
      - apps/backend/src/funnelmetry/**
      - apps/backend/src/subscribers/funnelmetry-order-placed.ts
      - apps/storefront/package.json
      - apps/storefront/tsconfig.json
      - apps/storefront/src/funnelmetry/**
      - apps/storefront/src/app/layout.tsx
      - apps/storefront/src/app/**/products/**/page.tsx
      - apps/storefront/src/app/**/checkout/page.tsx
      - apps/storefront/src/lib/data/cart.ts
      - apps/storefront/src/modules/products/components/product-actions/index.tsx
      - apps/storefront/src/modules/store/**
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Resolve packages and validate Medusa bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Medusa source
        uses: actions/checkout@v4

      - name: Set up Node and GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://npm.pkg.github.com
          scope: "@3002tad"

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.11.1 --activate

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
        env:
          # GITHUB_TOKEN works only when every private package grants this
          # repository's Actions workflow read access. The dedicated token is
          # a least-privilege fallback for packages owned by Funnelmetry.
          NODE_AUTH_TOKEN: ${{ secrets.FUNNELMETRY_PACKAGE_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build backend
        run: pnpm --filter @dtc/backend build

      - name: Type-check storefront integration
        run: pnpm --filter @dtc/storefront exec tsc --noEmit --pretty false
