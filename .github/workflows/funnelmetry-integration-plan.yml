name: Funnelmetry integration plan

on:
  workflow_dispatch:
  push:
    branches:
      - "funnelmetry/integration/**"
      - feature/cdc-medusa-v1
    paths:
      - funnelmetry.integration.yaml
      - runtime/check-cdc-source-config.mjs
      - runtime/check-cdc-source-config.test.mjs
      - runtime/docker-compose.cdc-logical.example.yml
      - .github/workflows/funnelmetry-integration-plan.yml

# This read-only workflow records the patch implied by the manifest. It does not
# gate or alter the propose workflow, create branches, merge, or deploy.
permissions:
  contents: read

jobs:
  plan:
    name: Record and check manifest-driven changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected Medusa integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: medusa

      - name: Validate target branch and immutable planner reference
        env:
          TARGET_REF: ${{ github.ref_name }}
          PLANNER_REF: ${{ vars.FUNNELMETRY_PLANNER_REF }}
        run: |
          if [[ "$TARGET_REF" != "feature/cdc-medusa-v1" && ! "$TARGET_REF" =~ ^funnelmetry/integration/[a-z0-9][a-z0-9._-]{0,80}$ ]]; then
            echo "The current branch must be pre-created under funnelmetry/integration/ or exactly feature/cdc-medusa-v1" >&2
            exit 1
          fi
          if [[ ! "$PLANNER_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Repository variable FUNNELMETRY_PLANNER_REF must be a reviewed immutable 40-character commit SHA" >&2
            exit 1
          fi

      - name: Checkout reviewed Funnelmetry planner
        uses: actions/checkout@v4
        with:
          repository: 3002tad/Funnelmetry
          ref: ${{ vars.FUNNELMETRY_PLANNER_REF }}
          path: funnelmetry
          persist-credentials: false
          token: ${{ secrets.FUNNELMETRY_PLANNER_READ_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate CDC source runtime guard
        working-directory: medusa
        run: node --test runtime/check-cdc-source-config.test.mjs

      - name: Generate, check, and record manifest-driven patch
        working-directory: medusa
        run: |
          mkdir -p "$RUNNER_TEMP/funnelmetry-plan"
          node "$GITHUB_WORKSPACE/funnelmetry/tools/medusa-ci-installer/src/cli.mjs" plan \
            --config "$GITHUB_WORKSPACE/medusa/funnelmetry.integration.yaml" \
            --project "$GITHUB_WORKSPACE/medusa" \
            --out "$RUNNER_TEMP/funnelmetry-plan"
          node -e 'const fs = require("node:fs"); const plan = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/funnelmetry-plan/integration-plan.json", "utf8")); const source = fs.readFileSync("funnelmetry.integration.yaml", "utf8"); if (/^cdc_shadow:/m.test(source) && (plan.capabilities?.cdcReferenceState !== "SHADOW_ONLY" || plan.cdcShadowOperatorPlan?.status !== "SHADOW_ONLY_NO_RUNTIME_ACTIVATION")) throw Error("Pinned planner does not support the CDC shadow manifest; update FUNNELMETRY_PLANNER_REF")'
          node -e 'const fs = require("node:fs"); const plan = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/funnelmetry-plan/integration-plan.json", "utf8")); const source = fs.readFileSync("funnelmetry.integration.yaml", "utf8"); if (/^cdc_order_v2_shadow:/m.test(source) && (plan.capabilities?.cdcOrderV2State !== "SHADOW_ONLY" || plan.cdcOrderV2OperatorPlan?.status !== "SHADOW_ONLY_NO_RUNTIME_ACTIVATION")) throw Error("Pinned planner does not support the CDC order v2 manifest; update FUNNELMETRY_PLANNER_REF")'
          node -e 'const fs = require("node:fs"); const plan = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/funnelmetry-plan/integration-plan.json", "utf8")); const source = fs.readFileSync("funnelmetry.integration.yaml", "utf8"); if (/^cdc_catalog_shadow:/m.test(source) && plan.capabilities?.cdcCatalogState !== "SHADOW_ONLY") throw Error("Pinned planner does not support the CDC catalog manifest; update FUNNELMETRY_PLANNER_REF")'
          node -e 'const fs = require("node:fs"); const plan = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/funnelmetry-plan/integration-plan.json", "utf8")); const source = fs.readFileSync("funnelmetry.integration.yaml", "utf8"); if (/^cdc_inventory_price_shadow:/m.test(source) && plan.capabilities?.cdcInventoryPriceState !== "SHADOW_ONLY") throw Error("Pinned planner does not support the CDC inventory/price manifest; update FUNNELMETRY_PLANNER_REF")'
          git apply --check --allow-empty "$RUNNER_TEMP/funnelmetry-plan/integration.patch"
          {
            echo "# Funnelmetry integration plan"
            echo
            echo "Configured branch: \`${GITHUB_REF_NAME}\`"
            echo "Planner commit: \`${{ vars.FUNNELMETRY_PLANNER_REF }}\`"
            echo
            echo "## Files the generated patch will change"
            echo '```text'
            git apply --numstat --allow-empty "$RUNNER_TEMP/funnelmetry-plan/integration.patch"
            echo '```'
            echo
            echo "## Planner record"
            echo '```json'
            cat "$RUNNER_TEMP/funnelmetry-plan/integration-plan.json"
            echo '```'
          } | tee "$RUNNER_TEMP/funnelmetry-plan/integration-change-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: funnelmetry-integration-plan-${{ github.sha }}
          path: ${{ runner.temp }}/funnelmetry-plan
          if-no-files-found: error
          retention-days: 14
