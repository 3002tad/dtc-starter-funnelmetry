name: Funnelmetry integration propose

on:
  push:
    branches:
      - "funnelmetry/integration/**"
    paths:
      - funnelmetry.integration.yaml

# A manifest commit is the source owner's authorization to update that same
# integration branch. This workflow never creates branches, merges, deploys,
# or reads runtime integration secrets.
permissions:
  contents: read

jobs:
  propose:
    name: Generate and apply integration proposal to current branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate immutable planner and current target branch
        env:
          TARGET_REF: ${{ github.ref_name }}
          PLANNER_REF: ${{ vars.FUNNELMETRY_PLANNER_REF }}
        run: |
          if [[ ! "$TARGET_REF" =~ ^funnelmetry/integration/[a-z0-9][a-z0-9._-]{0,80}$ ]]; then
            echo "The current branch must be a pre-created branch under funnelmetry/integration/" >&2
            exit 1
          fi
          if [[ ! "$PLANNER_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Repository variable FUNNELMETRY_PLANNER_REF must be a reviewed immutable 40-character commit SHA" >&2
            exit 1
          fi

      - name: Checkout selected Medusa integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: medusa
          fetch-depth: 0

      - name: Verify checked-out target branch
        working-directory: medusa
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          test "$(git branch --show-current)" = "$TARGET_REF"
          git show-ref --verify --quiet "refs/remotes/origin/$TARGET_REF"

      - name: Checkout reviewed Funnelmetry planner
        uses: actions/checkout@v4
        with:
          repository: 3002tad/Funnelmetry
          ref: ${{ vars.FUNNELMETRY_PLANNER_REF }}
          path: funnelmetry
          persist-credentials: false
          # Fine-grained PAT or GitHub App token: Contents = Read, scoped only
          # to 3002tad/Funnelmetry. It must not have host-repository write access.
          token: ${{ secrets.FUNNELMETRY_PLANNER_READ_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate review patch
        run: |
          mkdir -p "$RUNNER_TEMP/funnelmetry-plan"
          node funnelmetry/tools/medusa-ci-installer/src/cli.mjs plan \
            --config "$GITHUB_WORKSPACE/medusa/funnelmetry.integration.yaml" \
            --project "$GITHUB_WORKSPACE/medusa" \
            --out "$RUNNER_TEMP/funnelmetry-plan"

      - name: Read plan metadata
        id: plan_metadata
        run: |
          node -e 'const fs = require("node:fs"); const plan = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/funnelmetry-plan/integration-plan.json", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, "source_fingerprint=" + plan.sourceFingerprint + "\\nchange_count=" + plan.changes.length + "\\n")'

      - name: Validate generated-file allowlist
        working-directory: medusa
        run: |
          git apply --check "$RUNNER_TEMP/funnelmetry-plan/integration.patch"
          while IFS= read -r file; do
            case "$file" in
              "package.json" | "apps/backend/package.json" | "apps/backend/src/subscribers/funnelmetry-order-placed.ts" | "apps/storefront/package.json" | "apps/storefront/tsconfig.json" | "apps/storefront/src/app/layout.tsx" | "apps/storefront/src/app/[countryCode]/(main)/products/[handle]/page.tsx" | "apps/storefront/src/modules/products/components/product-actions/index.tsx" | "apps/storefront/src/app/[countryCode]/(checkout)/checkout/page.tsx" | "apps/storefront/src/funnelmetry/client.tsx") ;;
              *) echo "Generated patch changes a non-owned file: $file" >&2; exit 1 ;;
            esac
          done < <(git apply --numstat "$RUNNER_TEMP/funnelmetry-plan/integration.patch" | cut -f3)

      - name: Apply patch to target branch
        id: apply
        working-directory: medusa
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          git apply --index "$RUNNER_TEMP/funnelmetry-plan/integration.patch"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "status=no_changes" >> "$GITHUB_OUTPUT"
            echo "commit=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "funnelmetry-integration-bot[bot]"
          git config user.email "funnelmetry-integration-bot[bot]@users.noreply.github.com"
          git commit -m "chore(integration): propose Funnelmetry input binding"
          git push origin "HEAD:refs/heads/$TARGET_REF"
          echo "status=applied" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish review handoff
        run: |
          {
            echo "## Funnelmetry integration proposal"
            echo
            echo "Target branch: \`${{ github.ref_name }}\`."
            echo "Result: \`${{ steps.apply.outputs.status }}\`."
            echo "Commit: \`${{ steps.apply.outputs.commit || 'none' }}\`."
            echo "The proposal used planner commit \`${{ vars.FUNNELMETRY_PLANNER_REF }}\`."
            echo "Source fingerprint: \`${{ steps.plan_metadata.outputs.source_fingerprint }}\`; planned files: \`${{ steps.plan_metadata.outputs.change_count }}\`."
            echo "Review the diff and run normal Medusa CI before merging. This workflow did not create another branch, merge, deploy, or access runtime secrets."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated review artifact
        uses: actions/upload-artifact@v4
        with:
          name: funnelmetry-integration-proposal-${{ github.run_id }}
          path: ${{ runner.temp }}/funnelmetry-plan
          if-no-files-found: error
          retention-days: 14
