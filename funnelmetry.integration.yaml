# Non-secret declarative input-integration manifest.
# CI reads this file and produces a review-only patch outside this checkout.
apiVersion: funnelmetry.io/v1
kind: InputIntegration

host:
  type: medusa-v2-dtc-starter
  medusa_version: 2.19.0

source:
  id: medusa-reference

ingest:
  browser_url: http://localhost:31000/v1/ingress/events
  backend_url: http://host.docker.internal:31000/v1/ingress/events

auth:
  source_key_id: medusa-reference-dev
  browser_write_key_ref: FUNNELMETRY_BROWSER_WRITE_KEY
  backend_signing_key_ref: FUNNELMETRY_BACKEND_SIGNING_KEY

frontend:
  enabled: true
  events:
    - behavior.product_viewed
    - cart.add_clicked
    - checkout.started

backend:
  enabled: true
  binding: medusa.order_placed

# Các giá trị này là budget của Integration Kit; không chứa secret và không
# được phép biến lỗi Funnelmetry thành lỗi checkout/order của Medusa.
reliability:
  failure_mode: fail_open
  timeout_ms: 800
  max_queue_size: 200
  retry:
    max_attempts: 3
  circuit_breaker:
    failure_threshold: 3
    cooldown_ms: 30000
