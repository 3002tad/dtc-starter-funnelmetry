# Non-secret declarative input-integration manifest.
# CI treats this file as the source of truth, generates a patch with the pinned
# planner, and applies that patch only on the current integration branch.
apiVersion: funnelmetry.io/v2
kind: InputIntegration

host:
  type: medusa-v2-dtc-starter
  medusa_version: 2.19.0

source:
  id: medusa-reference

ingest:
  browser_url: https://ingest.entidi.io.vn/v1/ingress/events
  backend_url: http://source-ingress:32000/v1/ingress/events

auth:
  source_key_id: medusa-reference-source
  browser_write_key_ref: FUNNELMETRY_BROWSER_WRITE_KEY
  backend_signing_key_ref: FUNNELMETRY_BACKEND_SIGNING_KEY

bindings:
  browser:
    - behavior.page_viewed
    - behavior.scroll_depth_reached
    - promotion.banner_impression
    - promotion.banner_clicked
    - behavior.filter_applied
    - behavior.product_viewed
    - checkout.started
  storefront_server:
    - behavior.search_submitted
    - cart.item_added
  medusa_backend:
    - medusa.order_placed

# Reference-only CDC profile. This generates a reviewed, non-secret setup
# artifact; it does not activate CDC or replace the native order subscriber.
cdc_shadow:
  mode: shadow_only
  profile: reference.medusa.order_recorded_state.v1
  source_db_url_ref: FUNNELMETRY_CDC_SHADOW_DATABASE_URL
  source_owner: medusa-operator
  pipeline_owner: pipeline-operator
  snapshot_mode: no_data
  publication: funnelmetry_cdc_shadow
  slot: funnelmetry_cdc_shadow
  topic_prefix: cdc_shadow_medusa
  fact_topic: cdc_shadow_reference.order_recorded_state.v1
  table_columns:
    - public.order:id,deleted_at
    - public.order_cart:id,order_id,cart_id
    - public.cart:id,completed_at
  rollback_target: native_order_placed

# Các giá trị này là budget của Integration Kit; không chứa secret và không
# được phép biến lỗi Funnelmetry thành lỗi checkout/order của Medusa.
reliability:
  failure_mode: fail_open
  timeout_ms: 800
  max_queue_size: 200
  retry:
    max_attempts: 3
  circuit_breaker:
    failure_threshold: 3
    cooldown_ms: 30000
