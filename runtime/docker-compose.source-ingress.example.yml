services:
  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  # The search/cart dispatcher lives in storefront; backend may also emit
  # source-confirmed events, so both services use the Ingress network.
  backend:
    restart: unless-stopped
    networks:
      - default
      - source_ingress

  storefront:
    restart: unless-stopped
    networks:
      - default
      - source_ingress

networks:
  source_ingress:
    external: true
    # Replace with the actual external network name of the Ingress project.
    name: funnelmetry_source_ingress_default
