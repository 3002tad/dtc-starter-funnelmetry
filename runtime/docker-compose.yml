name: medusa_reference

# Docker runtime lives outside `apps/`, keeping upstream Medusa source intact.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: medusa
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: runtime/Dockerfile
    command: >-
      sh -c "cd apps/backend && pnpm exec medusa db:migrate && pnpm dev"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://medusa:medusa@postgres:5432/medusa?sslmode=disable
      REDIS_URL: redis://redis:6379
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:9000
      JWT_SECRET: local-development-only-jwt-secret
      COOKIE_SECRET: local-development-only-cookie-secret
    ports:
      - "127.0.0.1:9000:9000"

  storefront:
    build:
      context: ..
      dockerfile: runtime/Dockerfile
    command: sh -c "cd apps/storefront && pnpm dev"
    depends_on:
      backend:
        condition: service_started
    environment:
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://api.localhost:9000
      NEXT_PUBLIC_DEFAULT_REGION: dk
    env_file:
      - path: ../apps/storefront/.env.local
        required: false
    extra_hosts:
      - "api.localhost:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
