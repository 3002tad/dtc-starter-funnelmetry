name: medusa_reference

# Docker runtime lives outside `apps/`, keeping upstream Medusa source intact.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: medusa
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: runtime/Dockerfile
      target: backend-runtime
      secrets:
        - npm_token
    command: >-
      sh -c "cd apps/backend && pnpm exec medusa db:migrate && cd .medusa/server && ../../node_modules/.bin/medusa start"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://medusa:medusa@postgres:5432/medusa?sslmode=disable
      REDIS_URL: redis://redis:6379
      REDIS_PREFIX: "medusa-reference:"
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:9000
      JWT_SECRET: local-development-only-jwt-secret
      COOKIE_SECRET: local-development-only-cookie-secret
      MEDUSA_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:9000:9000"

  storefront:
    build:
      context: ..
      dockerfile: runtime/Dockerfile
      target: storefront-runtime
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-http://api.localhost:9000}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-dk}
        NEXT_PUBLIC_FUNNELMETRY_BROWSER_WRITE_KEY: ${NEXT_PUBLIC_FUNNELMETRY_BROWSER_WRITE_KEY:-}
      secrets:
        - npm_token
    command: sh -c "cd apps/storefront && ./node_modules/.bin/next start -p 8000"
    depends_on:
      backend:
        condition: service_started
    environment:
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-http://api.localhost:9000}
      NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-dk}
      NEXT_TELEMETRY_DISABLED: "1"
    env_file:
      - path: ../apps/storefront/.env.local
        required: false
    extra_hosts:
      - "api.localhost:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"

  # One-shot QA job. It is excluded from the normal Medusa runtime and starts
  # only through the `funnelmetry-test` profile with `docker compose run`.
  funnelmetry-api-bot:
    profiles: ["funnelmetry-test"]
    build:
      context: ..
      dockerfile: runtime/Dockerfile
      target: api-bot-runtime
    depends_on:
      backend:
        condition: service_started
    environment:
      FUNNELMETRY_BOT_MODE: ${FUNNELMETRY_BOT_MODE:-full}
      FUNNELMETRY_RELAY_URL: ${FUNNELMETRY_RELAY_URL:-https://ingest-test.entidi.io.vn/v1/ingress/events}
      FUNNELMETRY_SOURCE_ID: ${FUNNELMETRY_SOURCE_ID:-medusa-reference}
      FUNNELMETRY_SOURCE_KEY_ID: ${FUNNELMETRY_SOURCE_KEY_ID:-medusa-reference-relay}
      FUNNELMETRY_BROWSER_WRITE_KEY: ${NEXT_PUBLIC_FUNNELMETRY_BROWSER_WRITE_KEY:-}
      FUNNELMETRY_PRODUCT_IDS: ${FUNNELMETRY_PRODUCT_IDS:-}
      FUNNELMETRY_BOT_JOURNEYS: ${FUNNELMETRY_BOT_JOURNEYS:-10}
      FUNNELMETRY_BOT_CONCURRENCY: ${FUNNELMETRY_BOT_CONCURRENCY:-2}
      FUNNELMETRY_BOT_STEP_DELAY_MS: ${FUNNELMETRY_BOT_STEP_DELAY_MS:-50}
      MEDUSA_BACKEND_URL: http://backend:9000
      MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}
      MEDUSA_COUNTRY_CODE: ${MEDUSA_COUNTRY_CODE:-gb}

volumes:
  postgres_data:
  redis_data:

secrets:
  npm_token:
    environment: FUNNELMETRY_PACKAGE_READ_TOKEN
